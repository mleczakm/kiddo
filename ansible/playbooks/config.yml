---
# Kiddo Deployment Configuration
apps:
  - name: kiddo
    domain: "{{ domain | default('warsztatowniasensoryczna.pl') }}"
    # 9501 collides with an unrelated app (classy-cash) already bound to this
    # same host IPv6 - that's why every deploy since 2026-08-22 failed at
    # "Run application container" with "port is already allocated".
    port: 9502
    image: "ghcr.io/mleczakm/kiddo:{{ app_version | default('latest') }}"
    cache_volume: kiddo_cache
    env:
      APP_ENV: prod
    ipv6: "{{ mikrus_ipv6 }}"
    cytrus_host: "{{ cytrus_host }}"
    proxied: true
