---
- name: Verify routing secrets are present before touching the running container
  ansible.builtin.assert:
    that:
      - (cloudflare_api_token | default('')) | length > 0
      - (cloudflare_zone_id | default('')) | length > 0
      - (cytrus_api_token | default('')) | length > 0
      - (app.cytrus_host | default('')) | length > 0
    fail_msg: >-
      Missing or empty routing secret(s) for {{ app.name }}: cloudflare_api_token,
      cloudflare_zone_id, cytrus_api_token, and app.cytrus_host (CYTRUS_IPV4) must
      all be set, otherwise the container deploys but never receives traffic.
      Check the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID, CYTRUS_API_TOKEN and
      CYTRUS_IPV4 secrets in the GitHub 'production' environment.
  when: app.proxied | default(false)

- name: Log in to GHCR
  ansible.builtin.command: "docker login ghcr.io -u {{ github_actor }} --password-stdin"
  args:
    stdin: "{{ github_token }}"
  changed_when: false
  no_log: true

- name: Pull application image
  ansible.builtin.command: "docker pull {{ app.image }}"
  changed_when: true

- name: Validate cache volume name
  ansible.builtin.assert:
    that:
      - app.cache_volume is string
      - app.cache_volume | length > 0
      - app.cache_volume is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]+$')
    fail_msg: A safe explicit Docker volume name is required.

- name: Inspect cache volume
  ansible.builtin.command: "docker volume inspect {{ app.cache_volume }}"
  register: initial_volume_inspect
  failed_when: false
  changed_when: false

- name: Create cache volume
  ansible.builtin.command: >-
    docker volume create
    --label pl.mleczki.kiddo.persistent=true
    --label pl.mleczki.kiddo.purpose=opcache
    {{ app.cache_volume }}
  when: initial_volume_inspect.rc != 0
  changed_when: true

- name: Inspect geoip volume
  ansible.builtin.command: "docker volume inspect {{ app.geoip_volume }}"
  register: initial_geoip_volume_inspect
  failed_when: false
  changed_when: false
  when: app.geoip_volume is defined

- name: Create geoip volume
  ansible.builtin.command: >-
    docker volume create
    --label pl.mleczki.kiddo.persistent=true
    --label pl.mleczki.kiddo.purpose=geoip
    {{ app.geoip_volume }}
  when: app.geoip_volume is defined and initial_geoip_volume_inspect.rc != 0
  changed_when: true

- name: Create temporary MaxMind credentials file
  ansible.builtin.copy:
    content: |
      MAXMIND_ACCOUNT_ID={{ maxmind_account_id }}
      MAXMIND_LICENSE_KEY={{ maxmind_license_key }}
    dest: "/tmp/{{ app.name }}-maxmind.env"
    mode: '0600'
  when:
    - app.geoip_volume is defined
    - (maxmind_account_id | default('')) | length > 0
    - (maxmind_license_key | default('')) | length > 0
  no_log: true

# MaxMind's free GeoLite2 license key is capped at 30 downloads per 24h across
# the whole account. Deploys can happen many times a day (every push to master
# tags a release - see production-build-and-deploy.yml), so downloading on
# every deploy would blow through that quota fast. Keeping the database in its
# own persistent volume and only refreshing it here when it's missing or more
# than 7 days old decouples the download rate from the deploy rate - roughly
# one download a week, regardless of how many times the app deploys. MaxMind
# ships new GeoLite2-City builds about weekly anyway, so refreshing more often
# wouldn't get fresher data.
- name: Refresh GeoLite2 City database if missing or stale
  ansible.builtin.command: >-
    docker run --rm
    -v {{ app.geoip_volume }}:/data
    --env-file /tmp/{{ app.name }}-maxmind.env
    alpine:3.20
    sh -c 'set -e;
    if [ -f /data/GeoLite2-City.mmdb ] && [ -z "$(find /data/GeoLite2-City.mmdb -mtime +7)" ]; then
    echo "GeoLite2-City.mmdb is fresh, skipping download"; exit 0;
    fi;
    apk add --no-cache curl >/dev/null;
    curl -fsSL -u "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz" -o /tmp/geolite2-city.tar.gz;
    tar -xzf /tmp/geolite2-city.tar.gz -C /tmp;
    mv /tmp/GeoLite2-City_*/GeoLite2-City.mmdb /data/GeoLite2-City.mmdb.new;
    mv /data/GeoLite2-City.mmdb.new /data/GeoLite2-City.mmdb;
    echo "Downloaded fresh GeoLite2-City.mmdb"'
  register: geoip_refresh_result
  changed_when: "'Downloaded fresh' in geoip_refresh_result.stdout"
  when:
    - app.geoip_volume is defined
    - (maxmind_account_id | default('')) | length > 0
    - (maxmind_license_key | default('')) | length > 0
  # Deliberately not no_log:true - the docker invocation uses --env-file, so the
  # command line itself (which a failure would print) never contains the secret
  # values, only the credentials file's path. Hiding output here would hide the
  # actual curl/tar error too.

- name: Remove temporary MaxMind credentials file
  ansible.builtin.file:
    path: "/tmp/{{ app.name }}-maxmind.env"
    state: absent
  when: app.geoip_volume is defined

- name: Read production environment
  ansible.builtin.slurp:
    src: "{{ env_file_path }}"
  register: env_file_content
  delegate_to: localhost
  no_log: true

- name: Parse production environment
  ansible.builtin.set_fact:
    app_env_vars: >-
      {{
        (env_file_content.content | b64decode | regex_replace('\r', '')).split('\n')
        | select('match', '^[A-Z]')
        | map('regex_replace', '([^=]+)=(.*)', '\1=\2')
        | map('split', '=', 1)
        | items2dict(key_name=0, value_name=1)
      }}
  no_log: true

- name: Create temporary environment file
  ansible.builtin.copy:
    content: |
      {% for key, value in (app_env_vars | default({})).items() %}
      {{ key }}={{ value }}
      {% endfor %}
      {% for key, value in (app.env | default({})).items() %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "/tmp/{{ app.name }}.env"
    mode: '0600'
  no_log: true

# Runs against the new image *before* the old container is touched, so the
# still-running old code never sees a mid-migration schema, and the new
# code never starts serving/processing (HTTP or Messenger task workers)
# against a schema that hasn't caught up yet. A prior "start new container,
# then migrate" ordering left a window where the new container was already
# live but the columns it queries didn't exist yet.
- name: Run database migrations
  ansible.builtin.command: >-
    docker run --rm
    --env-file /tmp/{{ app.name }}.env
    {{ app.image }}
    bin/console doctrine:migrations:migrate --no-interaction
  register: migration_result
  changed_when: true

- name: Display migration result
  ansible.builtin.debug:
    var: migration_result.stdout_lines

# Runs against the new image while the old container is still serving, so a
# fresh/incomplete `setting` table fails the release here (with the exact list
# of missing keys for the super admin) instead of shipping wrong customer-facing
# payment details - OrganizationDetailsProvider silently substitutes historical
# hard-coded BLIK / bank-account values when the `organization_details` setting
# is absent.
- name: Verify required application settings are configured
  ansible.builtin.command: >-
    docker run --rm
    --env-file /tmp/{{ app.name }}.env
    {{ app.image }}
    bin/console app:check-installation
  register: installation_check_result
  changed_when: false

- name: Display installation check result
  ansible.builtin.debug:
    var: installation_check_result.stdout_lines

- name: Stop existing container
  ansible.builtin.command: "docker stop {{ app.name }}"
  register: stop_result
  failed_when: stop_result.rc not in [0, 1]
  changed_when: stop_result.rc == 0

- name: Remove existing container
  ansible.builtin.command: "docker rm {{ app.name }}"
  register: remove_result
  failed_when: remove_result.rc not in [0, 1]
  changed_when: remove_result.rc == 0

# The image ships a HEALTHCHECK, but plain `docker run` never acts on the
# resulting "unhealthy" state - `--restart always` only reacts to the process
# exiting. The shared compose stack used to get this for free: the `kiddo`
# service carried `autoheal.monitor.enable` and sat on the `mikrus` network
# alongside the docker-autoheal container that restarts unhealthy members.
# Since the deploy no longer goes through that compose file, we reattach the
# same label and network here so autoheal keeps watching this container.
#
# --ulimit nofile: `docker run` otherwise inherits the daemon default soft limit
# of 1024 open files. The Swoole server pools DB/HTTP/IMAP connections across
# long-lived workers and coroutines; production has hit a state where memory
# climbs and outbound connections (e.g. outgoing mail) silently start failing
# while /health still passes - an fd/socket ceiling that low is one way that
# happens. Raise the soft limit to 65536 (hard stays at the daemon default
# 524288); the /health memory_usage check now reports open_fds / tcp_allocated
# so this can be confirmed or ruled out.
- name: Run application container
  ansible.builtin.command: >-
    docker run -d
    --name {{ app.name }}
    --restart always
    --label autoheal.monitor.enable=true
    --label autoheal.restart.enable=true
    --ulimit nofile=65536:524288
    -p [{{ app.ipv6 }}]:{{ app.port }}:9501
    --env-file /tmp/{{ app.name }}.env
    --mount type=volume,src={{ app.cache_volume }},dst=/var/cache/prod/pools/app
    {{ '--mount type=volume,src=' ~ app.geoip_volume ~ ',dst=/app/var/geoip' if app.geoip_volume is defined else '' }}
    {{ app.image }}
  changed_when: true

# Attach to the shared external network in addition to the default bridge
# (mirroring the old compose `networks: {mikrus:, default:}`), so the
# autoheal container - and Traefik, for anything still routed that way - can
# reach it. Kept as a separate `network connect` to leave the proven
# IPv6 port-publish path on the default bridge untouched.
- name: Attach container to the shared mikrus network
  ansible.builtin.command: "docker network connect {{ app.shared_network | default('mikrus') }} {{ app.name }}"
  register: network_connect_result
  changed_when: network_connect_result.rc == 0
  failed_when:
    - network_connect_result.rc != 0
    - '"already exists" not in network_connect_result.stderr'

- name: Remove temporary environment file
  ansible.builtin.file:
    path: "/tmp/{{ app.name }}.env"
    state: absent

- name: Wait for the container to accept connections
  ansible.builtin.wait_for:
    host: "{{ app.ipv6 }}"
    port: "{{ app.port }}"
    timeout: 30

- name: Wait for HTTP health endpoint
  ansible.builtin.uri:
    url: "http://[{{ app.ipv6 }}]:{{ app.port }}/health"
    status_code: 200
  register: health_result
  retries: 10
  delay: 3
  until: health_result.status == 200

- name: Get Cloudflare DNS records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
  register: cf_records
  delegate_to: localhost
  when: cloudflare_api_token is defined and cloudflare_zone_id is defined

- name: Find existing Cloudflare A record
  ansible.builtin.set_fact:
    existing_a_record: "{{ cf_records.json.result | selectattr('name', 'equalto', app.domain) | selectattr('type', 'equalto', 'A') | first | default(None) }}"
    existing_cname_record: "{{ cf_records.json.result | selectattr('name', 'equalto', app.domain) | selectattr('type', 'equalto', 'CNAME') | first | default(None) }}"
  when: cloudflare_api_token is defined and cf_records.json.result is defined

- name: Select Cloudflare record to upsert
  ansible.builtin.set_fact:
    existing_record: "{{ existing_a_record if existing_a_record is not none else existing_cname_record }}"
  when: cloudflare_api_token is defined and cf_records.json.result is defined

- name: Create Cloudflare A record
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: A
      name: "{{ app.domain }}"
      content: "{{ app.cytrus_host }}"
      ttl: 1
      proxied: true
  delegate_to: localhost
  when: cloudflare_api_token is defined and existing_record is none

- name: Update Cloudflare A record
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records/{{ existing_record.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: A
      name: "{{ app.domain }}"
      content: "{{ app.cytrus_host }}"
      ttl: 1
      proxied: true
  delegate_to: localhost
  when: cloudflare_api_token is defined and existing_record is not none

- name: Verify Cytrus domain
  ansible.builtin.uri:
    url: https://api.mikr.us/domain
    method: POST
    body_format: form-urlencoded
    body:
      srv: "{{ ansible_host | regex_replace('\\..*', '') }}"
      key: "{{ cytrus_api_token }}"
    status_code: 200
  register: cytrus_domains
  delegate_to: localhost
  when: app.proxied | default(false)

- name: Check that the domain is configured in Cytrus
  ansible.builtin.assert:
    that:
      - app.domain in (cytrus_domains.json | map(attribute='name') | list)
    fail_msg: "Domain {{ app.domain }} is not configured in Cytrus."
  when: app.proxied | default(false)
