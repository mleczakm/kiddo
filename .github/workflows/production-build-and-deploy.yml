name: Production Build & Deploy

on:
  push:
    tags:
      - '*'

# Every push to master auto-creates a release tag, which triggers this
# workflow. Without this, two tags pushed close together deploy in parallel
# against the same production container name on the same host, and one
# run's docker stop/run can kill another run's in-flight database
# migration mid-execution. Queue instead of racing; never cancel a deploy
# that's already touching the running container.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The direct Cloudflare Worker -> /api/bank-mail path is opt-in per
      # environment: with none of its secrets set the deploy proceeds without it
      # (a warning is emitted); a partial or malformed setup fails the deploy.
      - name: Check bank mail deployment secrets
        id: bank_mail
        env:
          BANK_MAIL_ADDRESS: ${{ secrets.BANK_MAIL_ADDRESS }}
          BANK_MAIL_WEBHOOK_SECRET: ${{ secrets.BANK_MAIL_WEBHOOK_SECRET }}
          CLOUDFLARE_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          configured=0
          for name in BANK_MAIL_ADDRESS BANK_MAIL_WEBHOOK_SECRET CLOUDFLARE_WORKER_TOKEN; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "::warning::Bank mail secrets are not set in the production environment; skipping the Cloudflare Worker deployment (run scripts/setup-bank-mail-secrets.sh and add CLOUDFLARE_WORKER_TOKEN)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in BANK_MAIL_ADDRESS BANK_MAIL_WEBHOOK_SECRET CLOUDFLARE_WORKER_TOKEN CLOUDFLARE_ZONE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name in the production GitHub environment" >&2
              exit 1
            fi
          done
          if [[ ! "$BANK_MAIL_ADDRESS" =~ ^[a-f0-9]{32}@warsztatowniasensoryczna\.pl$ ]]; then
            echo "BANK_MAIL_ADDRESS has an invalid format" >&2
            exit 1
          fi
          if [[ ! "$BANK_MAIL_WEBHOOK_SECRET" =~ ^[a-f0-9]{64}$ ]]; then
            echo "BANK_MAIL_WEBHOOK_SECRET must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: python -m pip install --upgrade ansible-core

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create .env file
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
          BANK_MAIL_ADDRESS: ${{ secrets.BANK_MAIL_ADDRESS }}
          BANK_MAIL_WEBHOOK_SECRET: ${{ secrets.BANK_MAIL_WEBHOOK_SECRET }}
          BANK_MAIL_FROM: ${{ vars.BANK_MAIL_FROM || 'powiadomienia@alior.pl' }}
        run: |
          umask 077
          if [[ "${{ steps.bank_mail.outputs.enabled }}" == "true" ]]; then
            printf '%s\n' "$DOTENV_CONTENT" | grep -vE '^(BANK_MAIL_ADDRESS|BANK_MAIL_WEBHOOK_SECRET|BANK_MAIL_FROM)=' > .env.production || true
            {
              printf 'BANK_MAIL_ADDRESS=%s\n' "$BANK_MAIL_ADDRESS"
              printf 'BANK_MAIL_WEBHOOK_SECRET=%s\n' "$BANK_MAIL_WEBHOOK_SECRET"
              printf 'BANK_MAIL_FROM=%s\n' "$BANK_MAIL_FROM"
            } >> .env.production
          else
            printf '%s\n' "$DOTENV_CONTENT" > .env.production
          fi
          echo "ENV_FILE_PATH=$(pwd)/.env.production" >> "$GITHUB_ENV"

      - name: Deploy to Mikrus
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy.yml \
            --extra-vars "app_version=${{ github.ref_name }} cytrus_host=${{ secrets.CYTRUS_IPV4 }}" \
            --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --extra-vars "cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            --extra-vars "cytrus_api_token=${{ secrets.CYTRUS_API_TOKEN }}" \
            --extra-vars "ansible_host=${{ secrets.SSH_HOST }} mikrus_ipv6=${{ secrets.MIKRUS_IPV6 }}" \
            --extra-vars "ansible_port=${{ secrets.SSH_PORT }}" \
            --extra-vars "github_actor=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }}" \
            --extra-vars "env_file_path=${{ env.ENV_FILE_PATH }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_ROLES_PATH: ./ansible/roles

      - name: Set up Node for bank mail Worker
        if: steps.bank_mail.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy bank mail Worker and routing
        if: steps.bank_mail.outputs.enabled == 'true'
        run: |
          npm ci --prefix cloudflare/bank-mail
          node scripts/deploy-bank-mail.mjs
        env:
          CLOUDFLARE_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ENV_FILE_PATH: ${{ env.ENV_FILE_PATH }}
