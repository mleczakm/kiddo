; Temporary, local-only: enables ext-swoole's built-in leak tracer
; (swoole_tracer_leak_detect), wired up in App\Infrastructure\Swoole in when@prod
; services. PHP_INI_SYSTEM, so it can only be toggled here, not at runtime.
;
; Only safe with swoole.platform.coroutines.enabled: false in config/packages/swoole.yaml.
; With coroutines on, this segfaults (gdb backtrace: SIGSEGV in ext-ffi's FFI::free(),
; called from swoole-bundle/z-engine's FFI-based kernel-proxy cloning — the tracer's
; malloc-hook and z-engine's direct FFI frees corrupt each other's allocator bookkeeping).
swoole.leak_detection = On
