; Bind-mounted only into the dev-local `php` service (see compose.yaml) — never baked into
; any built image. Baking this in broke the `dev-local` build: `install-php-extensions`
; sanity-checks the extension by loading it, and xdebug.start_with_request=yes made that
; load attempt immediately try (and fail) to connect to the IDE.
;
; Lets Xdebug's step debugger follow Swoole's coroutine-based workers instead of losing the
; call stack across coroutine switches. Paired with SWOOLE_ALLOW_XDEBUG=1 (compose.yaml),
; which Swoole also requires before it will start with coroutines enabled while Xdebug is loaded.
swoole.enable_fiber_mock = On

xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.discover_client_host = true
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
