memory_limit = 2048M
opcache.enable_cli = 1
intl.default_locale = pl_PL.UTF-8
date.timezone = Europe/Warsaw

; swoole-bundle renames the compiled Symfony container class and loads both the original
; and the renamed class at once for coroutine proxification; with opcache.enable_cli on that
; combination corrupts Opcache and segfaults. The bundle generates a blacklist file (during
; cache:warmup, so it doesn't exist until the first run) that avoids this — see
; https://github.com/symfony-swoole/swoole-bundle "Opcache problems" in docs/configuration-reference.md.
opcache.blacklist_filename = "/app/var/cache/${APP_ENV}/swoole_bundle/opcache/blacklist.txt"