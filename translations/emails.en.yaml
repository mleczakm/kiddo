exception: Exception stack trace attached.

# Transfer Notifications
transfer:
  notification:
    not_matched:
      subject: 'Transfer Not Matched'
      content: |
        Hello,

        We have received a new transfer that could not be automatically matched to any payment.

        Transfer details:
        - Amount: {amount}
        - Sender: {sender}
        - Title: {title}
        - Date: {date}

        Please check and match this transfer manually in the admin panel.
    requires_review:
      subject: 'Large Transfer Requires Review'
      content: |
        Hello,

        We have received a transfer above the automatic matching threshold that requires manual review.

        Transfer details:
        - Amount: {amount}
        - Sender: {sender}
        - Title: {title}
        - Date: {date}

        Please check and match this transfer manually in the admin panel.

# Payment Notifications
payment:
  notification:
    user:
      subject: 'Payment Confirmation - '
      greeting: 'Thank you for your payment, {name}!'
      footer: 'If you have any questions, please contact the administrator.'
      add_to_calendar: 'Add to calendar'
      calendar_hint: 'You can also find these events in the attached calendar file (.ics).'
      info: >-
        We are pleased to confirm that we have received your payment of {amount}.

        Booked lessons:

    admin:
      subject: 'New Payment Received from "{user}" for '
      info: |-
        A new payment has been received:
        
        
        Amount: {amount}
        
        
        User: {user}
        
        
        Booked Lessons:
      footer: Please log in to the admin panel for more details.
    and_others: 'emails'

social:
  facebook_follow: 'Find news and updates on our Facebook page.'

daily_lessons_schedule:
  user_subject: "Reminder about today's lessons ({date})"
  user_greeting: "Hi {name},"
  user_reminder: "This is a quick reminder about your lessons today on {date}:"
  user_footer: "See you at the workshop!"
  add_to_calendar: 'Add to calendar'
  calendar_hint: 'You can also find these events in the attached calendar file (.ics).'
  facebook_contact: 'If you have any questions or anything changes, you can also reach us via'
  facebook_contact_link: 'our Facebook page'
  instructor_subject: "Your lessons today ({date})"
  instructor_greeting: "Hi {name},"
  instructor_reminder: "Here's a summary of your lessons today ({date}):"
  instructor_stats:
    lessons: "Lessons"
    attendees: "Attendees"
  instructor_footer: "See you at the workshop!"
  yesterday:
    heading: "Yesterday's summary ({date})"
    new_users:
      title: "New registrations"
      none: "No new registrations yesterday."
    new_reservations:
      title: "New reservations"
      none: "No new reservations yesterday."
    revenue:
      title: "Payments received"
  today:
    heading: "Today's lessons ({date})"

booking_cancellation:
  subject: 'Cancellation of booking for the class on {date}'
  content: |
    Dear {name},

    We regret to inform you that your booking for the class on {date} has been cancelled due to non-payment.

    If you believe this is a mistake, please contact us at kontakt@warsztatowniasensoryczna.pl

    You can make a new booking: {booking_url}

    Best regards,
    The Sensory Workshop Team
  admin:
    subject: 'Booking cancelled (no payment) - {user} - {date}'
    content: |
      Hello,

      Booking for {user} ({email}) for the class on {date} has been automatically cancelled due to no payment.

      Booking ID: {booking_id}
      Lesson: {lesson}

      Log in to the admin panel for more details.

# Reschedule admin notification
reschedule:
  notification:
    admin:
      subject: 'New reschedule — {user}'
      info: 'Information about a booking reschedule.'
      labels:
        user: 'User'
        email: 'Email'
        from: 'From'
        to: 'To'
        reason: 'Reason'
      footer: 'Log in to the admin panel to verify the details.'

legal:
  change_notification:
    subject: 'Document update: {document}'
    no_summary: 'We have updated the document.'
    body: >-
      We are letting you know that the document "{document}" changes, effective {effective}.

      {summary}

      You can find the new version at: {url}

      If you do not accept the change, you may terminate the agreement within 10 days
      of receiving this message. Not terminating it means accepting the new version.

account:
  close:
    email:
      pause:
        subject: "Your account has been paused"
        body: >-
          Your Warsztatownia Sensoryczna account has been paused at your request.

          To restore it, just log in again.
      delete:
        subject: "Your account will be deleted"
        body: >-
          We received a request to permanently delete your account. Your personal
          data will be anonymised after {grace} days.

          If you change your mind, log in again before then to cancel. Accounting
          records are kept as required by law.
