php-version = "8.5"

[source]
paths = [
  "bin",
  "config",
  "public",
  "src",
  "tests",
]
includes = ["vendor"]
excludes = ["config/reference.php", "var/**"]

[source.glob]
literal-separator = true

[formatter]
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["phpunit", "symfony"]
baseline = "lint-baseline.toml"
baseline-variant = "loose"

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
halstead = { effort-threshold = 7000 }

[analyzer]
baseline = "analysis-baseline.toml"
baseline-variant = "loose"
find-unused-definitions = true
find-unused-expressions = false
analyze-dead-code = false
check-throws = true
allow-possibly-undefined-array-keys = true
perform-heuristic-checks = true
