# Maintenance placeholder: every request gets the same 503 page (with Retry-After so
# crawlers and Cloudflare treat it as temporary). Nothing here talks to a database or
# any other service. The static assets are the only non-503 responses.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    server_tokens off;

    # Plain 200 so a deploy (or a human) can tell the placeholder is up without parsing HTML.
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "maintenance\n";
    }

    location ~ ^/(logo\.webp|favicon\.ico)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        return 503;
    }

    # Redirecting to a URI (not a named location) makes nginx turn POST/PUT/... into GET,
    # so every method gets the page with a 503 instead of "405 Not Allowed".
    error_page 503 /index.html;

    location = /index.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1800" always;
        add_header X-Robots-Tag "noindex" always;
    }
}
