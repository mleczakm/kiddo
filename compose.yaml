services:
  php:
    build:
      dockerfile: .docker/php/Dockerfile
      target: dev-local
      args:
        APP_VERSION: "201202121212"
        APP_REVISION: "dev"
    environment:
      COMPOSER_HOME: /.composer
      PHP_CS_FIXER_IGNORE_ENV: true
      SWOOLE_ALLOW_XDEBUG: 1
    # Docker's default seccomp profile blocks io_uring_setup/enter/register, which Swoole's
    # coroutine hooks need. This is Docker's default profile plus those three syscalls allowed,
    # instead of security_opt: seccomp=unconfined (which would drop all syscall filtering).
    security_opt:
      - seccomp=.docker/seccomp/swoole-io-uring.json
    volumes:
      - .:/app
      - ~/.composer:/.composer
      - .docker/php/ini/zz-php.ini:/usr/local/etc/php/conf.d/zz-php.ini
      - .docker/php/ini/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini

    user: 1000:1000
    ports:
      - "9501:9501"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "!ChangeMe!"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: ~
