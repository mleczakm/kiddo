# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  env(ELEVENLABS_API_KEY): ''
  env(ELEVENLABS_AGENT_ID): ''
  env(ELEVENLABS_ADMIN_AGENT_ID): ''
  env(KIDDO_MCP_SERVICE_KEY): ''
  env(HTTP_CLIENT_HEALTHCHECK_URL): 'https://connectivitycheck.gstatic.com/generate_204'
  # Steady state is ~5 processes (master, manager, 1 HTTP worker, 2 task workers - see
  # config/packages/swoole.yaml). Generous headroom above that for worker_max_request-triggered
  # recycling (briefly overlapping old/new workers), while still tripping well before the
  # leak patterns seen in production (~20 to ~1030 extra processes).
  env(HEALTHCHECK_MAX_PROCESSES): '20'
  # Total resident memory (MiB) across every process in the container's PID namespace above
  # which /health's memory_usage check flips to unhealthy (so autoheal restarts it instead
  # of it wedging - memory climbing, outgoing connections failing - until someone notices).
  # Steady state is ~250-550 MiB total (~200-270 MiB per worker once the coroutine pools are
  # bounded - see config/packages/swoole.yaml); a real runaway went multi-GB. 1536 leaves
  # generous headroom over worker_max_request recycle overlap while still tripping on a leak.
  # Set to 0 to disable the failure and only surface the numbers.
  env(HEALTHCHECK_MAX_RSS_MIB): '1536'
  # Seconds without a completed scheduler tick above which /health's scheduler_heartbeat
  # check fails (503 -> autoheal restart). The Timer::tick interval is 1s, so 90 is ~90
  # missed ticks - comfortably past a single slow tick or the SCHEDULER_TICK_TIMEOUT_SECONDS
  # watchdog below, but far short of the hours it would take memory_usage to notice.
  env(HEALTHCHECK_SCHEDULER_MAX_SILENCE_SECONDS): '90'
  # Deadline for one Scheduler::run() pass. A SysV semaphore is not freed when the coroutine
  # holding it dies, so a run() that hangs (seen in production) wedges the scheduler forever;
  # past this the tick is abandoned, the lock released, and the next tick retries. Well under
  # HEALTHCHECK_SCHEDULER_MAX_SILENCE_SECONDS so a one-off hang self-heals without a restart.
  env(SCHEDULER_TICK_TIMEOUT_SECONDS): '15'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $appVersion: '%env(APP_VERSION)%'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Domain/'
      - '../src/Kernel.php'

  App\Application\Search\GlobalSearchQuery:
    alias: App\Infrastructure\Search\PostgresGlobalSearchQuery

  App\Application\File\FileStorageInterface:
    alias: App\Application\File\DatabaseFileStorage

  App\Application\Repository\ActivityLogRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\ActivityLogRepository

  App\Application\Repository\BookingRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\BookingRepository

  App\Application\Repository\ChildRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\ChildRepository

  App\Application\Repository\FileRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\FileRepository

  App\Application\Repository\FinanceContactRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\FinanceContactRepository

  App\Application\Repository\LessonMetadataRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\LessonMetadataRepository

  App\Application\Repository\LessonRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\LessonRepository

  App\Application\Repository\MenuHookLinkRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\MenuHookLinkRepository

  App\Application\Repository\NotificationRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\NotificationRepository

  App\Application\Repository\PaymentCodeRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\PaymentCodeRepository

  App\Application\Repository\PaymentRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\PaymentRepository

  App\Application\Repository\PostFileRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\PostFileRepository

  App\Application\Repository\RefundRequestRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\RefundRequestRepository

  App\Application\Repository\PostRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\PostRepository

  App\Application\Repository\SeriesRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\SeriesRepository

  App\Application\Repository\SettingRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\SettingRepository

  App\Application\Repository\TransferRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\TransferRepository

  App\Application\Repository\UserRepositoryInterface:
    alias: App\Infrastructure\Doctrine\Repository\UserRepository

  App\Application\Workflow\BookingStateMachineInterface:
    alias: App\Infrastructure\Symfony\Workflow\SymfonyBookingStateMachine

  App\Application\Workflow\PaymentStateMachineInterface:
    alias: App\Infrastructure\Symfony\Workflow\SymfonyPaymentStateMachine

  Mleczakm\AeonSchoolHolidays\PolishSchoolHolidays:
    arguments:
      $voivodeship: !php/enum Mleczakm\AeonSchoolHolidays\Voivodeship::Masovian

  App\Application\Service\HolidayChecker:
    arguments:
      $holidayProviders:
        - '@App\Infrastructure\Calendar\PolishPublicHolidays'
        - '@Mleczakm\AeonSchoolHolidays\PolishSchoolHolidays'

  App\Application\Notification\NotificationSenderInterface:
    alias: App\Infrastructure\Symfony\Notifier\SymfonyNotificationSender

  App\Application\Templating\TemplateRendererInterface:
    alias: App\Infrastructure\Symfony\Twig\SymfonyTemplateRenderer

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Application\CommandHandler\:
    resource: '../src/Application/CommandHandler/'
    tags: [ 'messenger.message_handler' ]

  # Stage 10 of the commerce rollout plan: these use cases have no controller/
  # LiveComponent consumer yet (that's Stage 11's cart frontend) - without a
  # consumer, Symfony's container compiler prunes them entirely rather than
  # just making them private, so functional tests couldn't fetch them at all.
  # Safe to drop this override once something in src/ depends on them.
  App\Application\UseCase\Cart\:
    resource: '../src/Application/UseCase/Cart/'
    public: true

  dunglas_doctrine_json_odm.serializer:
    class: Dunglas\DoctrineJsonOdm\Serializer
    arguments:
      - [ '@App\Infrastructure\Symfony\Serializer\MoneyNormalizer', '@App\Infrastructure\Symfony\Serializer\LessonMapNormalizer', '@?dunglas_doctrine_json_odm.normalizer.backed_enum', '@?dunglas_doctrine_json_odm.normalizer.uid', '@dunglas_doctrine_json_odm.normalizer.datetime', '@dunglas_doctrine_json_odm.normalizer.array', '@dunglas_doctrine_json_odm.normalizer.object' ]
      - [ '@serializer.encoder.json' ]
      - '@?dunglas_doctrine_json_odm.type_mapper'
    public: true
    autowire: false
    autoconfigure: false

  # Symfony Scheduler now runs on the Swoole event loop via mleczakm/swoole-bundle-scheduler
  # (see config/packages/swoole_bundle_scheduler.yaml). The former app-local Scheduler,
  # WithScheduler configurator and heartbeat/health-check classes moved into that bundle;
  # MainSchedule stays here and is discovered through its #[AsSchedule] attribute.
  # SchedulerConnectionGuard is the pre_run hook - autowired from src/, no config needed.

  DirectoryTree\ImapEngine\MailboxInterface:
    class: DirectoryTree\ImapEngine\Mailbox
    arguments:
      $config:
        port: 993
        ssl: true
        username: '%env(MAILBOX_USERNAME)%'
        password: '%env(MAILBOX_PASSWORD)%'
        host: '%env(MAILBOX_HOST)%'
    public: true

  App\Infrastructure\ImapEngine\AliorNotificationMailProvider:
    arguments:
      $mailboxUsername: '%env(MAILBOX_USERNAME)%'
      $mailboxPassword: '%env(MAILBOX_PASSWORD)%'

  # Guards the Mailbox connection directly (lower priority = inner, see the
  # decoration_priority comment further down) - IncomingNotificationMailQueryWithLastSuccessfulImportDecorator
  # stays the outermost decorator, unchanged.
  App\Application\CommandHandler\IncomingNotificationMailQueryReentrancyGuardDecorator:
    decorates: App\Infrastructure\ImapEngine\AliorNotificationMailProvider
    decoration_priority: -10
    arguments:
      $decorated: '@.inner'

  App\Application\CommandHandler\ImportTransfersFromMailHandler:
    arguments:
      $mailboxUsername: '%env(MAILBOX_USERNAME)%'
      $mailboxPassword: '%env(MAILBOX_PASSWORD)%'

  Symfony\Component\Cache\Psr16Cache:

  Psr\SimpleCache\CacheInterface:
    alias: Symfony\Component\Cache\Psr16Cache

  SymfonyHealthCheckBundle\Check\DoctrineORMCheck:
    alias: symfony_health_check.doctrine_orm_check

  # Scanner honeypot (extracted to mleczakm/zip-bomb-honeypot, not covered by the App\ autodiscovery above)
  Mleczakm\ZipBombHoneypot\MaliciousRequestSubscriber: ~
  Mleczakm\ZipBombHoneypot\HoneypotResponder: ~
  Mleczakm\ZipBombHoneypot\MaliciousRequestPathMatcher: ~
  Mleczakm\ZipBombHoneypot\ZipBombGenerator: ~

  # Sentry services for Monolog handler
  BGalati\MonologSentryHandler\SentryHandler:
    arguments:
      $hub: '@Sentry\State\HubInterface'
      # Service handlers are constructed by the container, so Monolog's handler-level
      # `level` option does not configure this constructor argument.
      $level: !php/const Monolog\Logger::ERROR
  Sentry\Integration\RequestIntegration:
  Sentry\Integration\EnvironmentIntegration:
  Sentry\Integration\FrameContextifierIntegration:
  Sentry\Integration\RequestFetcherInterface:
    class: Sentry\Integration\RequestFetcher

  App\Infrastructure\Sentry\MetricsRecorderInterface:
    alias: App\Infrastructure\Sentry\MetricsRecorder

  Symfony\Contracts\Service\ResetInterface:
    alias: services_resetter

  App\Infrastructure\Doctrine\EntityManagerResetter:
    public: true
    tags:
      - { name: swoole_bundle.safe_stateful_service }

  App\Infrastructure\ImapEngine\ConnectionCloserOnResetSubscriber:
    public: true
    tags:
      - { name: swoole_bundle.safe_stateful_service }

  App\Infrastructure\Swoole\SwooleServerProviderInterface:
    class: App\Infrastructure\Swoole\HttpServerSwooleServerProvider

  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'

  App\Infrastructure\Twig\MoneyExtension:
    tags: [ 'twig.extension' ]

  Mleczakm\TwigNow\NowExtension:
    tags: [ 'twig.extension' ]


  # Gedmo SoftDeleteable listener
  Gedmo\SoftDeleteable\SoftDeleteableListener:
    tags:
      - { name: 'doctrine.event_listener', event: 'onFlush' }
      - { name: 'doctrine.event_listener', event: 'loadClassMetadata' }

  # Decorator for IncomingNotificationMailQuery to track last successful import
  App\Application\CommandHandler\IncomingNotificationMailQueryWithLastSuccessfulImportDecorator:
    decorates: App\Infrastructure\ImapEngine\AliorNotificationMailProvider
    arguments:
      $decorated: '@.inner'

  App\Application\CommandHandler\IncomingNotificationMailQuery: '@App\Application\CommandHandler\IncomingNotificationMailQueryWithLastSuccessfulImportDecorator'

  # Outer decorator logs any task failure, including connection ensure failures. Higher
  # decoration_priority = outer, so this sees exceptions thrown by the ensure decorator below.
  App\Infrastructure\Swoole\ExceptionLoggingTaskHandler:
    decorates: SwooleBundle\SwooleBundle\Server\TaskHandler\TaskHandler
    decoration_priority: -9995

  App\Infrastructure\Swoole\TaskWorkerConnectionEnsuringHandler:
    decorates: SwooleBundle\SwooleBundle\Server\TaskHandler\TaskHandler
    decoration_priority: -9996
    arguments:
      $innerHandler: '@.inner'

  App\Infrastructure\Doctrine\CacheConnectionEnsurer:
    arguments:
      $connection: '@doctrine.dbal.cache_connection'

  App\Infrastructure\Healthcheck\DoctrineDbalCacheHealthcheck:
    arguments:
      $cacheConnection: '@doctrine.dbal.cache_connection'

  App\Infrastructure\Healthcheck\HttpClientHealthcheck:
    arguments:
      $url: '%env(HTTP_CLIENT_HEALTHCHECK_URL)%'

  App\Infrastructure\Healthcheck\ProcessCountHealthcheck:
    arguments:
      $maxProcesses: '%env(int:HEALTHCHECK_MAX_PROCESSES)%'

  App\Infrastructure\Healthcheck\MemoryUsageHealthcheck:
    arguments:
      $maxRssMib: '%env(int:HEALTHCHECK_MAX_RSS_MIB)%'

  # Symfony normally builds this via the HttpClient::create() factory, whose return type
  # (CurlHttpClient vs NativeHttpClient) is only known at runtime. The coroutine proxifier
  # skips any service whose class isn't statically known, so it never pools this - every
  # coroutine ends up sharing one CurlHttpClient's native curl handles, which Swoole
  # correctly rejects concurrent use of ("This cURL handle is currently executing in
  # coroutine#N"). Pinning the class here (same as what the factory picks, since ext-curl
  # is compiled into Swoole - see a61dc04) makes it visible to the proxifier so it can be
  # added to platform.coroutines.stateful_services below.
  http_client.transport:
    class: Symfony\Component\HttpClient\CurlHttpClient

  # Ensure both the default ORM connection and the dedicated cache DBAL connection.
  App\Infrastructure\Doctrine\CompositeConnectionEnsurer:
    arguments:
      $ensurers:
        - '@App\Infrastructure\Doctrine\DoctrineConnectionEnsurer'
        - '@App\Infrastructure\Doctrine\CacheConnectionEnsurer'

  App\Infrastructure\Doctrine\ConnectionEnsurerInterface:
    alias: App\Infrastructure\Doctrine\CompositeConnectionEnsurer

  # Replace Symfony MCP Bundle controller: rebuild PSR-7 body from buffered content
  # so Streamable HTTP clients (ElevenLabs) do not hit JSON-RPC -32700 on empty body.
  mcp.server.controller:
    class: App\Infrastructure\Mcp\KiddoMcpController
    public: true
    arguments:
      - '@mcp.server'
      - '@mcp.psr_http_factory'
      - '@mcp.http_foundation_factory'
      - '@mcp.psr17_factory'
      - '@mcp.psr17_factory'
      - '@mcp.middleware_factory'
      - '@logger'
    tags:
      - controller.service_arguments
      - { name: monolog.logger, channel: mcp }

# SentryBundle is only registered for prod (config/bundles.php), so it's the only environment
# where Sentry\State\HubInterface comes pre-bound to a real, DSN-configured client (see
# vendor/sentry/sentry-symfony's own services.yaml: HubAdapter::getInstance() + bindClient()).
# dev/test still need *a* Hub to satisfy BGalati\MonologSentryHandler\SentryHandler's
# autowired $hub argument, so fall back to the bare SDK singleton here — it never gets a
# client bound, so captures are harmless no-ops rather than being sent anywhere.
when@dev:
  services:
    Sentry\State\HubInterface:
      factory: [ 'Sentry\SentrySdk', 'getCurrentHub' ]

# Test-specific service overrides
when@test:
  services:
    Sentry\State\HubInterface:
      factory: [ 'Sentry\SentrySdk', 'getCurrentHub' ]

    App\Infrastructure\Doctrine\ConnectionEnsurerInterface:
      alias: App\Infrastructure\Doctrine\CompositeConnectionEnsurer
      public: true

    # Publish Brevo services so tests can swap them via container->set().
    App\Infrastructure\Brevo\BrevoNewsletterService:
      autowire: true
      public: true

    App\Application\Newsletter\NewsletterSubscriptionManager:
      autowire: true
      public: true
