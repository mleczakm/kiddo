framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 5
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - messenger.middleware.router_context
                    - App\Infrastructure\Messenger\PreventAsyncDispatchInTaskWorkerMiddleware
                    - messenger.middleware.doctrine_transaction
                    - messenger.middleware.doctrine_close_connection
                    - App\Infrastructure\Messenger\ActivityLogMiddleware
                    - messenger.middleware.validation

        routing:
            'Symfony\Component\Notifier\Message\MessageInterface': sync
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync
            # Keep handler-dispatched commands on sync; nested async is also blocked by PreventAsyncDispatchInTaskWorkerMiddleware
            'App\Application\Command\AddBooking': sync
            'App\Application\Command\SaveTransfer': sync
            'App\Application\Command\MatchPaymentForTransfer': sync
            'App\Application\Command\SendLoginNotification': sync
            'App\Application\Command\Notification\SendVerificationCode': sync
            'App\Application\Command\SendReservationNotification': sync
            'App\Message\RefundLessonBooking': sync
            'App\Message\CancelLessonBooking': sync
            # Route everything else to async
            '*': async

when@test:
    framework:
        messenger:
            transports:
                async: test://
            routing:
                # DoctrineInsideTaskWorkerHealthcheck dispatches this and waits (via cache) for a
                # real task worker to pick it up and write the result back. test:// never consumes
                # what's dispatched to it (it just records messages for assertions), so this
                # guaranteed-timed-out forever under the default '*': async routing - invisible
                # only because /health previously returned 200 regardless of check results (see
                # symfony_health_check.yaml). Routing it to sync makes the dispatch (and the
                # DoctrineORMCheck it runs) execute inline, which is the closest test-env
                # equivalent to "a task worker handled it" since there's no real task worker
                # concept in a request/response test.
                'App\Application\Command\DoctrineInsideTaskWorkerCheck': sync
