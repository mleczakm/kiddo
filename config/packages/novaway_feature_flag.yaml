novaway_feature_flag:
  default_manager: default
  managers:
    default:
      factory: 'novaway_feature_flag.factory.array'
      options:
        features:
          cart: true
          platform_billing_widget: true
          chat_assistant: true
          commerce_order_write: true
          # Consent enforcement (registration / panel re-acceptance / checkout).
          # OFF on prod until the versioned legal documents are published and the
          # one-off re-acceptance prompt for every existing user is timed
          # deliberately. `legal_documents` alone only swaps the static /regulamin
          # pages for the versioned ones (static fallback until a version exists);
          # enforcement needs BOTH flags — see App\Application\Consent\ConsentRequirements.
          consents: false
          dynamic_pricing: true
          # Built-in help & documentation centre at /admin/pomoc.
          help_center: true
          legal_documents: true
          # Admin manual + quick booking form on the bookings screen / dashboard.
          manual_bookings: true
          pricing_admin: true
          # Monthly-subscription ticket type + recurring billing. OFF on prod
          # until operational sign-off; on in dev/test via the blocks below.
          subscriptions: false
          # Chat-assistant waitlist ("notify me when a spot frees up"). A single
          # lesson can still be opted out via Lesson::waitlistEnabled = false.
          waitlist: true

# The "features" map is a raw array and REPLACES the base map (see the test
# block's comment) - so any environment override must restate every flag.
when@dev:
  novaway_feature_flag:
    managers:
      default:
        options:
          features:
            cart: true
            platform_billing_widget: true
            chat_assistant: true
            commerce_order_write: true
            consents: true
            dynamic_pricing: true
            help_center: true
            legal_documents: true
            manual_bookings: true
            pricing_admin: true
            subscriptions: true
            waitlist: true

when@test:
  novaway_feature_flag:
    managers:
      default:
        options:
          # This whole "features" map replaces the base one above rather than merging with
          # it (the underlying config node is a raw array, not a Symfony config tree), so it
          # must restate every flag it wants to keep at its base-config value, not just the
          # ones it overrides.
          features:
            cart: true
            platform_billing_widget: true
            chat_assistant: true
            commerce_order_write: false
            consents: true
            dynamic_pricing: true
            help_center: true
            legal_documents: true
            pricing_admin: true
            manual_bookings: true
            subscriptions: true
            waitlist: true
