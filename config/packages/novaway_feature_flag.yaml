novaway_feature_flag:
  default_manager: default
  managers:
    default:
      factory: 'novaway_feature_flag.factory.array'
      options:
        features:
          cart: true
          platform_billing_widget: true
          chat_assistant: true
          commerce_order_write: true
          consents: false
          dynamic_pricing: true
          # Built-in help & documentation centre at /admin/pomoc. OFF on prod
          # until the content is reviewed; on in dev/test via the blocks below.
          help_center: false
          legal_documents: false
          # Admin manual + quick booking form on the bookings screen / dashboard.
          manual_bookings: true
          pricing_admin: false
          # Monthly-subscription ticket type + recurring billing. OFF on prod
          # until operational sign-off; on in dev/test via the blocks below.
          subscriptions: false
          # Chat-assistant waitlist ("notify me when a spot frees up"). OFF on
          # prod until sign-off; on in dev/test. A single lesson can still be
          # opted out via Lesson::waitlistEnabled = false while the flag is on.
          waitlist: false

# The "features" map is a raw array and REPLACES the base map (see the test
# block's comment) - so any environment override must restate every flag.
when@dev:
  novaway_feature_flag:
    managers:
      default:
        options:
          features:
            cart: true
            platform_billing_widget: true
            chat_assistant: true
            commerce_order_write: true
            consents: true
            dynamic_pricing: true
            help_center: true
            legal_documents: true
            manual_bookings: true
            pricing_admin: false
            subscriptions: true
            waitlist: true

when@test:
  novaway_feature_flag:
    managers:
      default:
        options:
          # This whole "features" map replaces the base one above rather than merging with
          # it (the underlying config node is a raw array, not a Symfony config tree), so it
          # must restate every flag it wants to keep at its base-config value, not just the
          # ones it overrides.
          features:
            cart: true
            platform_billing_widget: true
            chat_assistant: true
            commerce_order_write: false
            consents: true
            dynamic_pricing: true
            help_center: true
            legal_documents: true
            pricing_admin: true
            manual_bookings: true
            subscriptions: true
            waitlist: true
