monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            buffer:
                type: buffer
                level: debug
                handler: main
                buffer_size: 0 # No limit
            main:
                type: stream
                path: "php://stderr"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            grouped_main:
                type: whatfailuregroup
                members: [main, sentry]
            main:
                type: stream
                path: php://stdout
                formatter: monolog.formatter.json
                level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Keep both the main output and Sentry free of an outer BufferHandler. In the
            # long-running Swoole process it is not closed per request, so an unlimited
            # buffer retains every LogRecord and steadily grows worker memory.
            sentry:
                type: fingers_crossed
                action_level: error
                handler: sentry_handler
                include_stacktraces: true
                process_psr_3_messages: true
                # 404/405 are routine client noise (bots, iOS's unconditional apple-touch-icon
                # probing, etc.), not application errors — don't send them to Sentry.
                excluded_http_codes: [404, 405]
                channels: [ "!event" ]
            sentry_handler:
                type: service
                id: BGalati\MonologSentryHandler\SentryHandler
