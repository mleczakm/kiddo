monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            buffer:
                type: buffer
                level: debug
                handler: main
                buffer_size: 0 # No limit
            main:
                type: stream
                path: "php://stderr"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            buffer:
                type: buffer
                level: debug
                handler: grouped_main
                buffer_size: 0 # No limit
            grouped_main:
                type: whatfailuregroup
                members: [main, sentry]
            main:
                type: stream
                path: php://stdout
                formatter: monolog.formatter.json
                level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Point fingers_crossed directly at SentryHandler (no intermediate BufferHandler).
            # BufferHandler only flushes on close()/reset(), and under Swoole shutdown never runs
            # per request — so events sat in memory and never reached Sentry.
            sentry:
                type: fingers_crossed
                action_level: warning
                handler: sentry_handler
                include_stacktraces: true
                process_psr_3_messages: true
                channels: [ "!event" ]
            sentry_handler:
                type: service
                id: BGalati\MonologSentryHandler\SentryHandler
