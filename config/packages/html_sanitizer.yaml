framework:
    html_sanitizer:
        sanitizers:
            app.article_sanitizer:
                allow_elements:
                    p: '*'
                    h2: '*'
                    h3: '*'
                    h4: '*'
                    strong: '*'
                    em: '*'
                    u: '*'
                    s: '*'
                    code: '*'
                    pre: '*'
                    blockquote: '*'
                    ul: '*'
                    ol: '*'
                    li: '*'
                    br: '*'
                    hr: '*'
                    a: ['href', 'title', 'target', 'rel']
                    img: ['src', 'alt', 'width', 'height', 'class']
                    figure: ['class']
                    figcaption: '*'
                    table: '*'
                    thead: '*'
                    tbody: '*'
                    tr: '*'
                    th: ['colspan', 'rowspan']
                    td: ['colspan', 'rowspan']
                    # class-only div/span: back the Callout ("Warto wiedzieć")
                    # block until a dedicated Tiptap node exists. Only known
                    # class names are given CSS treatment, so an arbitrary
                    # value is inert, not a styling/attribute-injection risk.
                    div: ['class']
                    span: ['class']
                allowed_link_schemes: ['http', 'https', 'mailto']
                allow_relative_links: true
                force_attributes:
                    a:
                        rel: 'noopener noreferrer'
                max_input_length: 1000000
