# 0.3 starts scheduling after fork in HTTP worker #0. Shared-memory ownership
# serializes passes across worker reloads; heartbeat no longer writes to cache.app.
swoole_bundle_scheduler:
    enabled: true

    # Maximum idle sleep; known due dates (including 30s recurrences) wake it earlier.
    interval: 60

    # Keep Kiddo's readiness checks before due checkpoint work and message dispatch.
    pre_run: 'App\Infrastructure\Doctrine\SchedulerConnectionGuard'

    # Log a slow pass without starting concurrent work against the same generators.
    # Permanent stalls are recovered by the health-check supervisor.
    watchdog:
        enabled: true
        timeout: '%env(int:SCHEDULER_TICK_TIMEOUT_SECONDS)%'

    # Lateness relative to the expected next pass, not time since the last idle tick.
    # Registered in symfony_health_check.yaml; unhealthy responses use HTTP 503.
    health_check:
        enabled: true
        max_silence: '%env(int:HEALTHCHECK_SCHEDULER_MAX_SILENCE_SECONDS)%'
