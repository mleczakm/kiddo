doctrine:
  dbal:
    default_connection: default
    types:
      ulid: Symfony\Bridge\Doctrine\Types\UlidType
      lesson_map: App\Infrastructure\Doctrine\LessonMapType
      adjustment_type_enum: App\Infrastructure\Doctrine\AdjustmentTypeType
    connections:
      default:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # Connection keep-alive settings for long-running processes
        options:
          'PDO::ATTR_TIMEOUT': 30
          'PDO::ATTR_EMULATE_PREPARES': false

      # Separate connection for DBAL-backed cache so ORM transactions do not affect cache I/O.
      # Must be a Doctrine-managed connection so test dbname_suffix applies (CI only creates app_test).
      cache:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        options:
          'PDO::ATTR_TIMEOUT': 30
          'PDO::ATTR_EMULATE_PREPARES': false
  orm:
    validate_xml_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    identity_generation_preferences:
      Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
    auto_mapping: true
    filters:
      softdeleteable:
        class: Gedmo\SoftDeleteable\Filter\SoftDeleteableFilter
        enabled: true
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Entity'
        alias: App
      AppCommerce:
        type: xml
        is_bundle: false
        dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Commerce/Mapping'
        prefix: 'App\Domain\Commerce'
        alias: AppCommerce
    controller_resolver:
      auto_mapping: false
    dql:
      string_functions:
        JSONB_CONTAINS: Scienta\DoctrineJsonFunctions\Query\AST\Functions\Postgresql\JsonbContains
        ILIKE: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Ilike
        JSON_GET_TEXT: Scienta\DoctrineJsonFunctions\Query\AST\Functions\Postgresql\JsonGetText

when@test:
  doctrine:
    dbal:
      connections:
        default:
          # "TEST_TOKEN" is typically set by ParaTest
          dbname_suffix: '_test%env(default::TEST_TOKEN)%'
        cache:
          dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
  doctrine:
    orm:
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
