swoole:
  # Capacity for the coroutine-safe session storage. Session persistence still uses
  # Symfony's PDO handler (configured in framework.yaml), so sessions survive restarts.
  session:
    max_data_bytes: 16384
    max_active_sessions: 4096
  http_server:
    static: advanced
    exception_handler:
      # coroutines mode always fetches "swoole_bundle.error_handler.symfony_error_handler",
      # which only gets registered when the exception handler type is "symfony"
      type: symfony
    services:
      trust_all_proxies_handler: true
      access_log:
        enabled: true
    trusted_proxies: '*'
    settings:
      worker_count: 1
      worker_max_request: 500
      log_file: '/proc/self/fd/2'
      # Default 2MiB is too small for heavy pages (e.g. workshops with many LiveComponents).
      buffer_output_size: 8388608
  task_worker:
    services:
      reset_handler: true
    settings:
      worker_count: 2
  platform:
    coroutines:
      enabled: true
      # Symfony's form registry keeps a mutable resolution stack. Without a
      # coroutine-local instance, concurrent form rendering can falsely report
      # a circular FormType reference.
      #
      # CurlHttpClient (config/services.yaml pins its class so the proxifier can see it -
      # Symfony normally builds it via a factory, which isn't statically typeable) holds a
      # native curl multi-handle. Left shared, two coroutines touching it at once hit
      # "This cURL handle is currently executing in coroutine#N, cannot be operated" -
      # Swoole correctly refusing concurrent use of one native resource, confirmed under load
      # testing on the memory-debug branch.
      stateful_services:
        - form.registry
        - Sentry\SentryBundle\Tracing\HttpClient\TraceableHttpClient.inner
      # Without a cap, each worker/task-worker process pools a separate Doctrine connection
      # instance per coroutine context, which was exhausting Postgres's max_connections (100)
      # within seconds of boot (12 processes x scheduler polling every ~1s).
      doctrine_processor_config:
        global_limit: 5
      # Without this, every OTHER pooled stateful service (Twig\Environment, EntityManager,
      # Router, ~45 others per class_alias/final-class audit) falls back to the bundle's
      # default ceiling of max_coroutines (100000) live instances each, since we only ever
      # capped Doctrine connections specifically. That's the actual cause of the multi-GB RSS
      # growth observed on prod with coroutines on (see memory-debug branch investigation) —
      # not a real leak, just an unbounded pool. This app's traffic never needs anywhere near
      # this many concurrent in-flight coroutines; bounding it caps growth per pooled service.
      max_concurrency: 50

swoole_bundle_resetter:
  # default false - if set to true, the app will check if there is an active transaction
  # in the processed connection, and it will rollback the transaction.
  # Needed in every env now that coroutines pool multiple connection instances per worker:
  # a coroutine that fails mid-transaction otherwise leaves its pooled connection dirty for
  # whichever coroutine picks it up next, surfacing as "There is already an active transaction".
  check_active_transactions: true

when@prod:
  swoole_bundle_resetter:
    # default 0 - if set, the connection ping operation will be executed each X seconds
    # (instead of at the beginning of each request)
    ping_interval: 29

# Coroutines only matter for the real swoole HTTP server process; PHPUnit's WebTestCase never
# runs inside one. With coroutines on, swoole-bundle swaps the container's `kernel` service for
# a clone ("kernel_proxy") that deliberately shares bundle instances with the original kernel
# (see CoroutinesSupportingKernel::__clone(), a no-op by design so worker coroutines share
# state). KernelBrowser resolves its injected `@kernel` to that clone and reboots it between
# every request; the clone's first shutdown() nulls the container on bundle objects the real
# kernel (tracked separately as KernelTestCase::$kernel) still holds references to, so that
# kernel crashes with "Call to a member function hasParameter() on null" the moment its own
# shutdown() runs in tearDown(). Disabling coroutines for tests sidesteps the clone entirely.
when@test:
  swoole:
    platform:
      coroutines:
        enabled: false
